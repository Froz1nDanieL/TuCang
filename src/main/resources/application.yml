server:
  port: ${SERVER_PORT:8123}
  servlet:
    context-path: /api
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: tu-cang-backend
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:tu-cang-backend/.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/tucang?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  redis:
    database: ${REDIS_DATABASE:0}
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 5000
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
  session:
    store-type: redis
    timeout: ${SESSION_TIMEOUT_SECONDS:2592000}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: ${KNIFE4J_ENABLED:true}
  openapi:
    title: "TuCang API"
    version: 1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.mushan.tucangbackend.controller

cos:
  client:
    host: ${COS_HOST:}
    secretId: ${COS_SECRET_ID:}
    secretKey: ${COS_SECRET_KEY:}
    region: ${COS_REGION:}
    bucket: ${COS_BUCKET:}

aliYunAi:
  apiKey: ${ALIYUN_AI_API_KEY:}

picture:
  color-search:
    backfill-enabled: ${PICTURE_COLOR_BACKFILL_ENABLED:false}

tucang:
  ai:
    text-model: ${ALIYUN_AI_TEXT_MODEL:wanx2.1-t2i-turbo}
    outpaint-model: ${ALIYUN_AI_OUTPAINT_MODEL:image-out-painting}
    task-sync-enabled: ${AI_TASK_SYNC_ENABLED:false}
    task-sync-delay-ms: ${AI_TASK_SYNC_DELAY_MS:30000}
  admin:
    review-sla-minutes: ${REVIEW_SLA_MINUTES:30}
    asset-diagnostic-timeout-ms: ${ASSET_DIAGNOSTIC_TIMEOUT_MS:2000}
    index-check-page-size: ${INDEX_CHECK_PAGE_SIZE:200}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
  websocket:
    allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
  elasticsearch:
    initialize-index: ${ES_INITIALIZE_INDEX:false}
    sync:
      full-enabled: ${ES_FULL_SYNC_ENABLED:false}
      incremental-enabled: ${ES_INCREMENTAL_SYNC_ENABLED:false}
  database:
    initialize-picture-color-schema: ${DB_INITIALIZE_PICTURE_COLOR_SCHEMA:false}
  jobs:
    picture-tasks-enabled: ${PICTURE_TASKS_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
